<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Violin Teacher</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif;
      background: #1a1a2e;
      color: #fff;
      min-height: 100vh;
      max-width: 420px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .app-icon {
      width: 40px; height: 40px; border-radius: 10px;
      background: #7c3aed; display: flex; align-items: center; justify-content: center;
    }
    .app-icon svg { width: 24px; height: 24px; }
    .app-title h1 { font-size: 17px; font-weight: 600; }
    .app-title p { font-size: 13px; color: #94a3b8; }
    .status {
      display: flex; align-items: center; gap: 6px;
      font-size: 13px; color: #64748b;
      background: rgba(255,255,255,0.06); padding: 5px 12px; border-radius: 20px;
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #64748b; }
    .status-dot.on { background: #22c55e; }
    
    .tabs {
      display: flex; padding: 0 16px 12px; gap: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .tab {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 10px 0; font-size: 14px; font-weight: 500;
      color: #94a3b8; border-radius: 10px; border: none; background: none; cursor: pointer;
    }
    .tab.active { color: #a78bfa; background: rgba(124,58,237,0.12); }
    
    .content { padding: 16px; display: none; }
    .content.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    .card {
      background: #16213e; border-radius: 16px; padding: 16px; margin-bottom: 12px;
    }
    .card-title {
      display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 500; margin-bottom: 12px;
    }
    .video-area {
      width: 100%; aspect-ratio: 4/3; background: #000; border-radius: 12px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; margin-bottom: 12px; position: relative; overflow: hidden;
    }
    .video-area.recording { border: 2px solid #ef4444; }
    .rec-indicator {
      position: absolute; top: 12px; right: 12px;
      display: none; align-items: center; gap: 6px;
      font-size: 12px; color: #ef4444; background: rgba(0,0,0,0.6);
      padding: 4px 10px; border-radius: 20px;
    }
    .video-area.recording .rec-indicator { display: flex; }
    .rec-dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    
    .btn-record {
      width: 100%; padding: 12px; border-radius: 12px; font-size: 15px; font-weight: 600;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      border: none; cursor: pointer; transition: all 0.2s;
    }
    .btn-record.start { background: #7c3aed; color: #fff; }
    .btn-record.stop { background: #ef4444; color: #fff; }
    
    .sheet-row {
      display: flex; align-items: center; justify-content: space-between;
      background: #16213e; border-radius: 16px; padding: 12px 16px;
    }
    .sheet-label { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #94a3b8; }
    .sheet-select {
      display: flex; align-items: center; gap: 6px;
      font-size: 14px; font-weight: 500; background: #0f3460;
      padding: 6px 14px; border-radius: 10px; cursor: pointer; border: none; color: #fff;
    }
    
    .note-bubble {
      width: 36px; height: 36px; border-radius: 50%; background: #0f3460;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 600; color: #a78bfa;
    }
    .note-bubble.active { background: #7c3aed; color: #fff; transform: scale(1.1); }
    
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .stat-card { background: #16213e; border-radius: 16px; padding: 16px; text-align: center; }
    .stat-value { font-size: 28px; font-weight: 600; color: #a78bfa; }
    .stat-label { font-size: 12px; color: #94a3b8; margin-top: 4px; }
    
    .history-item {
      display: flex; justify-content: space-between; padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .history-item:last-child { border-bottom: none; }
    .score { font-weight: 600; }
    .score.high { color: #22c55e; }
    .score.mid { color: #eab308; }
    
    .center { text-align: center; padding: 40px 20px; }
    .big-icon { width: 64px; height: 64px; margin: 0 auto 16px; color: #a78bfa; opacity: 0.8; }
    .hint { font-size: 14px; color: #64748b; }
    
    .controls { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 16px; }
    .ctrl-btn {
      width: 40px; height: 40px; border-radius: 50%; background: #0f3460;
      display: flex; align-items: center; justify-content: center;
      border: none; color: #fff; cursor: pointer;
    }
    .play-btn {
      padding: 10px 24px; border-radius: 24px; background: #7c3aed;
      color: #fff; font-size: 14px; font-weight: 600; border: none; cursor: pointer;
      display: flex; align-items: center; gap: 6px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-left">
      <div class="app-icon">
        <svg viewBox="0 0 24 24" fill="white"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
      </div>
      <div class="app-title">
        <h1>AI Violin Teacher</h1>
        <p>智能小提琴老師</p>
      </div>
    </div>
    <div class="status" onclick="toggleConnect()">
      <span class="status-dot" id="connDot"></span>
      <span id="connText">未連接</span>
    </div>
  </div>

  <div class="tabs">
    <button class="tab" onclick="switchTab('practice')">🎵 練習</button>
    <button class="tab active" onclick="switchTab('record')">📹 錄影</button>
    <button class="tab" onclick="switchTab('stats')">📊 紀錄</button>
  </div>

  <div class="content active" id="tab-record">
    <div class="card">
      <div class="card-title">📹 錄影</div>
      <div class="video-area" id="videoArea">
        <div class="rec-indicator">
          <span class="rec-dot"></span>
          <span id="recTimer">00:00</span>
        </div>
        <svg width="48" height="48" viewBox="0 0 24 24" fill="#444"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        <span class="hint" id="videoHint">點擊開始錄影</span>
      </div>
      <button class="btn-record start" id="recordBtn" onclick="toggleRecord()">
        <span id="btnDot" style="width:10px;height:10px;border-radius:50%;background:#fff;"></span>
        <span id="btnText">開始錄影</span>
      </button>
    </div>
    <div class="sheet-row">
      <div class="sheet-label">🎼 樂譜</div>
      <button class="sheet-select" onclick="nextSheet()">
        <span id="sheetName">小星星</span> ▼
      </button>
    </div>
  </div>

  <div class="content" id="tab-practice">
    <div class="center">
      <svg class="big-icon" viewBox="0 0 24 24" fill="#a78bfa"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
      <h2 style="font-size:18px;margin-bottom:8px;">小星星</h2>
      <p style="font-size:14px;color:#94a3b8;">跟隨 AI 老師的指導，逐句練習</p>
    </div>
    <div class="card">
      <div style="font-size:12px;color:#64748b;margin-bottom:12px;">音符序列</div>
      <div style="display:flex;justify-content:center;gap:8px;" id="noteRow">
        <div class="note-bubble active">Do</div>
        <div class="note-bubble">Do</div>
        <div class="note-bubble">Sol</div>
        <div class="note-bubble">Sol</div>
        <div class="note-bubble">La</div>
        <div class="note-bubble">La</div>
        <div class="note-bubble">Sol</div>
      </div>
      <div class="controls">
        <button class="ctrl-btn" onclick="prevNote()">◀</button>
        <button class="play-btn" onclick="playDemo()">▶ 示範演奏</button>
        <button class="ctrl-btn" onclick="nextNote()">▶</button>
      </div>
    </div>
  </div>

  <div class="content" id="tab-stats">
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-value">12</div><div class="stat-label">總練習次數</div></div>
      <div class="stat-card"><div class="stat-value">8.5</div><div class="stat-label">練習時長 (h)</div></div>
      <div class="stat-card"><div class="stat-value">87</div><div class="stat-label">平均得分</div></div>
      <div class="stat-card"><div class="stat-value">5</div><div class="stat-label">連續天數</div></div>
    </div>
    <div class="card">
      <div style="font-size:14px;font-weight:500;margin-bottom:10px;">最近練習</div>
      <div class="history-item"><span>小星星</span><span class="score high">92 分</span></div>
      <div class="history-item"><span>歡樂頌</span><span class="score high">85 分</span></div>
      <div class="history-item"><span>卡農</span><span class="score mid">78 分</span></div>
      <div class="history-item"><span>小星星</span><span class="score high">88 分</span></div>
    </div>
  </div>

  <script>
    let currentTab = 'record';
    let isRecording = false;
    let recTimer = null;
    let recSec = 0;
    let currentNote = 0;
    const sheets = ['小星星', '歡樂頌', '卡農', '天鵝湖'];
    let sheetIdx = 0;

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.textContent.includes(tab==='practice'?'練習':tab==='record'?'錄影':'紀錄')));
      document.querySelectorAll('.content').forEach(c => c.classList.toggle('active', c.id === 'tab-' + tab));
    }

    function toggleRecord() {
      const btn = document.getElementById('recordBtn');
      const area = document.getElementById('videoArea');
      const hint = document.getElementById('videoHint');
      const text = document.getElementById('btnText');

      if (!isRecording) {
        isRecording = true;
        area.classList.add('recording');
        hint.textContent = '正在錄影中...';
        btn.className = 'btn-record stop';
        text.textContent = '停止錄影';
        recSec = 0;
        recTimer = setInterval(() => {
          recSec++;
          const m = String(Math.floor(recSec/60)).padStart(2,'0');
          const s = String(recSec%60).padStart(2,'0');
          document.getElementById('recTimer').textContent = m+':'+s;
        }, 1000);
      } else {
        isRecording = false;
        area.classList.remove('recording');
        hint.textContent = '點擊開始錄影';
        btn.className = 'btn-record start';
        text.textContent = '開始錄影';
        clearInterval(recTimer);
        document.getElementById('recTimer').textContent = '00:00';
      }
    }

    function nextSheet() {
      sheetIdx = (sheetIdx + 1) % sheets.length;
      document.getElementById('sheetName').textContent = sheets[sheetIdx];
    }

    function updateNotes() {
      document.querySelectorAll('#noteRow .note-bubble').forEach((n,i) => {
        n.classList.toggle('active', i === currentNote);
      });
    }

    function nextNote() {
      currentNote = Math.min(currentNote + 1, 6);
      updateNotes();
    }

    function prevNote() {
      currentNote = Math.max(currentNote - 1, 0);
      updateNotes();
    }

    function playDemo() {
      let i = 0;
      const interval = setInterval(() => {
        currentNote = i;
        updateNotes();
        i++;
        if (i > 6) clearInterval(interval);
      }, 500);
    }

    function toggleConnect() {
      const dot = document.getElementById('connDot');
      const text = document.getElementById('connText');
      const on = dot.classList.contains('on');
      dot.classList.toggle('on');
      text.textContent = on ? '未連接' : '已連接';
    }
  </script>
</body>
</html>
