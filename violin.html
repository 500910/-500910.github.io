<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频录音功能预览</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; }
        #videoPreview { width: 100%; max-width: 640px; background: #000; border-radius: 8px; }
        .controls { margin-top: 15px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; margin: 0 5px; }
    </style>
</head>
<body>

    <h2>视频录音功能预览</h2>
    <video id="videoPreview" autoplay playsinline muted></video>

    <div class="controls">
        <button id="startBtn" onclick="startVideoRecording()">开始录制</button>
        <button id="stopBtn" onclick="stopVideoRecording()" disabled>停止录制</button>
    </div>

    <h3>录制结果：</h3>
    <div id="recordedContainer"></div>

    <script>
        let mediaRecorder;
        let recordedChunks = [];
        let currentStream = null;

        async function startVideoRecording() {
            try {
                // 1. 获取音视频流（修正了中文双引号问题）
                currentStream = await navigator.mediaDevices.getUserMedia({
                    audio: true,
                    video: { 
                        facingMode: "user", 
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                });

                // 2. 显示预览画面
                const videoPreview = document.getElementById('videoPreview');
                videoPreview.srcObject = currentStream;
                
                // 3. 配置 MediaRecorder
                recordedChunks = [];
                let mimeType = 'video/webm;codecs=vp9,opus';
                
                // 兼容 Safari / iOS（Safari 不一定支持 vp9，回退到 video/mp4 或默认格式）
                if (!MediaRecorder.isTypeSupported(mimeType)) {
                    mimeType = 'video/mp4';
                }

                mediaRecorder = new MediaRecorder(currentStream, { mimeType: MediaRecorder.isTypeSupported(mimeType) ? mimeType : '' });

                mediaRecorder.ondataavailable = e => {
                    if (e.data.size > 0) recordedChunks.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    
                    // 补充 saveVideo 逻辑：生成播放器与下载按钮
                    saveVideo(url);

                    // 停止所有摄像头/麦克风轨道
                    if (currentStream) {
                        currentStream.getTracks().forEach(t => t.stop());
                    }
                };

                mediaRecorder.start();
                document.getElementById('startBtn').disabled = true;
                document.getElementById('stopBtn').disabled = false;

            } catch (e) {
                alert('无法存取摄影机或麦克风：' + e.message);
            }
        }

        function stopVideoRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
                document.getElementById('startBtn').disabled = false;
                document.getElementById('stopBtn').disabled = true;
            }
        }

        function saveVideo(url) {
            const container = document.getElementById('recordedContainer');
            container.innerHTML = `
                <video src="${url}" controls style="width:100%; max-width:640px; margin-top:100px;"></video><br>
                <a href="${url}" download="recording.webm" style="display:inline-block; margin-top:10px;">下载视频</a>
            `;
        }
    </script>
</body>
</html>
