      <button onclick="doRegister()" class="login-btn">📝 注册</button>
      <div class="login-link" onclick="showLogin()">已有账号？去登录</div>

function importCSV(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const text = e.target.result;
    const lines = text.split('\n');
    let added = 0;
    for (let i = 1; i < lines.length; i++) {
      const cols = lines[i].split(',').map(s => s.trim());
      if (cols.length >= 4 && cols[0]) {
        const symbol = cols[0].toUpperCase();
        const shares = parseFloat(cols[1]) || 0;
        const cost = parseFloat(cols[2]) || 0;
        const price = parseFloat(cols[3]) || 0;
        if (shares > 0 && cost > 0 && price > 0) {
          const pnl = (price - cost) * shares;
          const pnlPct = ((price - cost) / cost * 100);
          portfolio.push({ symbol, shares, cost, price, sector: '其他', pnl, pnlPct, marketValue: price * shares });
          added++;
        }
      }
    }
    document.getElementById('csv-status').textContent = `✅ 成功导入 ${added} 只股票`;
    renderPortfolio();
    updateAnalytics();
    savePortfolio();
  };
  reader.readAsText(file);
  input.value = '';
}

function setSignal(sig) {
  currentSignal = sig;

function updateSignalUI(sig) {
  const colors = { buy: '#10b981', hold: '#f59e0b', sell: '#ef4444' };
  document.querySelectorAll('.sig-btn').forEach(btn => {
    const isActive = btn.dataset.sig === sig;
    btn.style.borderColor = isActive ? colors[sig] : '#334155';
    btn.style.background = isActive ? colors[sig] + '18' : '#0f1117';
    btn.querySelector('div:last-child').style.color = isActive ? colors[sig] : '#94a3b8';
  });
}

function updateAnalytics() {
  if (portfolio.length === 0) { resetUI(); return; }
  const totalCost = portfolio.reduce((sum, s) => sum + s.cost * s.shares, 0);
  const totalValue = portfolio.reduce((sum, s) => sum + s.price * s.shares, 0);
  const totalPnl = totalValue - totalCost;
  const avgPnlPct = totalCost > 0 ? (totalPnl / totalCost * 100) : 0;

  let score = 50;
  score += Math.min(avgPnlPct * 2, 25);
  score += Math.min(portfolio.length * 3, 15);
  const sectors = new Set(portfolio.map(s => s.sector));
  score += Math.min(sectors.size * 5, 10);
  score = Math.max(0, Math.min(100, Math.round(score)));

  document.getElementById('score-value').textContent = score;
  document.getElementById('score-bar').style.width = score + '%';
  const scoreLabel = score >= 80 ? '优秀' : score >= 60 ? '良好' : score >= 40 ? '一般' : '需优化';
  document.getElementById('score-desc').textContent = `OMLA 综合评分: ${scoreLabel} · 基于 ${portfolio.length} 只持仓`;

  const volatility = portfolio.reduce((sum, s) => sum + Math.abs(s.pnlPct), 0) / portfolio.length;
  const riskLevels = [
    { max: 5, level: '低风险', color: '#10b981', bars: 1 },
    { max: 15, level: '中低风险', color: '#06b6d4', bars: 2 },
    { max: 30, level: '中风险', color: '#f59e0b', bars: 3 },
    { max: 50, level: '高风险', color: '#f97316', bars: 4 },
    { max: Infinity, level: '极高风险', color: '#ef4444', bars: 5 },
  ];
  const risk = riskLevels.find(l => volatility < l.max);
  const rb = document.getElementById('risk-badge');
  rb.textContent = risk.level;
  rb.style.background = risk.color + '22';
  rb.style.color = risk.color;
  document.getElementById('risk-text').textContent = `平均波动率 ${volatility.toFixed(1)}% · 持仓分散度 ${sectors.size} 个行业`;
  document.querySelectorAll('.risk-bar').forEach((d, i) => { d.style.background = i < risk.bars ? risk.color : '#334155'; });

  let signal = avgPnlPct > 10 ? 'sell' : avgPnlPct < -10 ? 'buy' : 'hold';
  const sigReasons = {
    buy: '多数持仓处于低位，建议逢低加仓，把握反弹机会。',
    hold: '持仓表现平稳，建议继续持有，关注市场方向选择。',
    sell: '部分持仓涨幅较大，建议适当获利了结，锁定收益。'
  };
  currentSignal = signal;
  updateSignalUI(signal);
  document.getElementById('signal-reason').textContent = sigReasons[signal];

  const sorted = [...portfolio].sort((a, b) => b.pnlPct - a.pnlPct);
  const topGainer = sorted[0];
  const topLoser = sorted[sorted.length - 1];
  const sectorList = Array.from(sectors);
  document.getElementById('ai-summary').textContent =
    `您的投资组合共持有 ${portfolio.length} 只股票，总市值约 $${(totalValue/1000).toFixed(1)}K。整体${totalPnl >= 0 ? '盈利' : '亏损'} $${Math.abs(totalPnl).toFixed(2)}（${avgPnlPct >= 0 ? '+' : ''}${avgPnlPct.toFixed(2)}%）。行业覆盖 ${sectorList.join('、')} 共 ${sectors.size} 个板块。表现最佳的是 ${topGainer.symbol}（+${topGainer.pnlPct.toFixed(2)}%），需关注的是 ${topLoser.symbol}（${topLoser.pnlPct.toFixed(2)}%）。建议根据风险等级调整仓位，保持行业分散。`;

  document.getElementById('capital-flow').style.display = 'block';
  document.getElementById('capital-empty').style.display = 'none';
  const mainFlow = (Math.random() * 200 - 50).toFixed(1);
  const retailFlow = (Math.random() * 100 - 30).toFixed(1);
  const instFlow = (Math.random() * 150 - 20).toFixed(1);
  const mf = document.getElementById('main-flow');
  mf.textContent = (mainFlow > 0 ? '+' : '') + mainFlow + 'M';
  mf.style.color = mainFlow > 0 ? '#10b981' : '#ef4444';
  const rf = document.getElementById('retail-flow');
  rf.textContent = (retailFlow > 0 ? '+' : '') + retailFlow + 'M';
  rf.style.color = retailFlow > 0 ? '#10b981' : '#ef4444';
  const inf = document.getElementById('inst-flow');
  inf.textContent = (instFlow > 0 ? '+' : '') + instFlow + 'M';
  inf.style.color = instFlow > 0 ? '#10b981' : '#ef4444';
  document.getElementById('flow-bar').style.width = (30 + Math.random() * 40) + '%';
}
